# Pentium 133: ASUS P/I-P55T2P4 (i430HX, on-board IDE), S3 Trio64 PCI, SB16.
# @HDD@ is replaced by scripts/dos/run-86box.sh.
[General]
vid_renderer = qt_software
confirm_exit = 0
confirm_reset = 0
confirm_save = 0

[Machine]
machine = p55t2p4
cpu_family = pentium_p54c
cpu_speed = 133333333
cpu_multi = 2
cpu_use_dynarec = 0
fpu_type = internal
mem_size = 32768

[Video]
gfxcard = s3_trio64_pci

[Input devices]
mouse_type = ps2

[Sound]
sndcard = sb16
fm_driver = nuked

[Storage controllers]
hdc_1 = internal

[Hard disks]
hdd_01_parameters = 63, 16, 130, 0, ide
hdd_01_fn = @HDD@
hdd_01_ide_channel = 0:0

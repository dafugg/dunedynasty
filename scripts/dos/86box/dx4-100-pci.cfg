# 486 DX4/100: ASUS PVI-486SP3 (SiS 496, VLB+PCI, on-board IDE), S3 Trio64 PCI, SB16.
# @HDD@ is replaced by scripts/dos/run-86box.sh.
[General]
vid_renderer = qt_software
confirm_exit = 0
confirm_reset = 0
confirm_save = 0

[Machine]
machine = 486sp3c
cpu_family = idx4
cpu_speed = 100000000
cpu_multi = 3
cpu_use_dynarec = 0
fpu_type = internal
mem_size = 16384

[Video]
gfxcard = s3_trio64_pci

[Input devices]
mouse_type = ps2

[Sound]
sndcard = sb16
fm_driver = nuked

[Storage controllers]
hdc_1 = internal

[Hard disks]
hdd_01_parameters = 63, 16, 130, 0, ide
hdd_01_fn = @HDD@
hdd_01_ide_channel = 0:0

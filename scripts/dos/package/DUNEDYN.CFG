# Dune Dynasty for MS-DOS configuration.
# The game rewrites this file on exit, keeping these comments.

[graphics]
# 320x240 is best on a 486 (any VGA card); 640x480 and up need VESA
# and a Pentium for full speed. See README.TXT.
screen_width=640
screen_height=480
# 1 or 2. 2 doubles everything, like Dune II on a 640x480 screen.
#menubar_scale=2
#sidebar_scale=2
#viewport_scale=2

[enhancement]
skip_introduction=0
